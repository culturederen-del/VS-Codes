<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="gamemode1.css">
<script src="training.js" defer></script>
<script src="charStats.js" defer></script>
<script src="randowrd.js" defer></script>  <!-- Loads first -->

<script src="UI-Functions.js" defer></script>

</head>


<body>

<div class="entireScreen">



<div id="upperGameDisplay" style="opacity:1">
    <div class="icon"></div>
    
    <div class="userStateHUD">
        <div id="userStats"> </div>
    </div>
    <div id="timeElapsed" class="timerDesign"></div>
    <div id="currentEnemyStateHud">
    </div>
</div>


<div class="battleArena">
    <div class="inputOutputs">
        <div class="randomPairBox">
        <h2 id="fumbleDisplay"></h2>
        <h2 id="randomPairDisplay"></h2>
        </div>
            <h2 id="output"> </h2>
            <div id="inputSection" style="opacity:0; transition: opacity 0.5s;">
                <input type="text" id="wordInput" placeholder="Type your word"><br>
                <button id="wordSent">Verify!</button>
            </div>
    </div>
</div>


    <img class="bgArenaDisplay" src="imgRes/bgbattle1.jpg">
    <div id="damageTint"> </div>





<div class="gameOverPopUp"> 
    <div class="gameOverDisplay">
        <div class="gameOverResponse">
        <h1> Oops! You ran out of time </h1>
        </div>
        <div class="imgContainer"> 
            <img class ="sadFace" src="imgRes/SadFaceFail.png">
        </div>      
        <h1> Your Score: 0000</h1>
        <a href="mainHUD.html" class="gameOverReturn"> Go Back</a>
    </div>
</div>
<img class="enemySprite" src="imgRes/EnemySprite1.png">
<div class="enemyShadow"></div>

<img class="userSprite" src="imgRes/UserSprite1.png">
<div class="userShadow"></div>
<div class="optionsUI" id="optUi"> 
    <h2 id="categoryResult"></h2>
    <div id="mainOpt" class="actionHUD">
        <button class="actionBtn" id="attackOpt">Attack</button>
        <button class="actionBtn" id="defendOpt">Defend</button>
        <button class="actionBtn" id="itemOpt">Item</button>
        <a id="runOpt" class="exitButton" href="mainHUD.html">Run</a>

        <div id="optButtons" class="optButtons hidden">
            <div class="optContent">
                <button class="typeBtn" id="PhysOpt">Prefix</button>
                <button class="typeBtn" id="MentOpt">Infix</button> 
                <button class="typeBtn" id="AstralOpt">Suffix</button>
                <button id="optClose" class="closeTypes">X</button>
            </div>
        </div>
    </div>
</div>

<!-- DialogBox moved HERE, at very bottom -->
<div id="dialogBox">
    <p id="dialogText"></p>
</div>

</div>

</body>
</html>
